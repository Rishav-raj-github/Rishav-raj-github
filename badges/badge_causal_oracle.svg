<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="causalBg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="80%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#causalBg)" stroke="#ffffff" stroke-width="4.5" filter="url(#badgeShadow)" />
  <ellipse cx="60" cy="24" rx="36" ry="14" fill="#ffffff" opacity="0.18" />

  <!-- Causal Graph & Oracle Eye -->
  <g transform="translate(60, 60)">
    <!-- Outer Sacred Geometry Ring -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Direct Acyclic Graph Nodes -->
    <circle cx="0" cy="-18" r="6" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <circle cx="-18" cy="12" r="6" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <circle cx="18" cy="12" r="6" fill="#ffffff" stroke="#059669" stroke-width="2" />

    <!-- Directed Causal Arrows -->
    <line x1="-3" y1="-14" x2="-14" y2="8" stroke="#ffffff" stroke-width="2.5" />
    <line x1="3" y1="-14" x2="14" y2="8" stroke="#ffffff" stroke-width="2.5" />
    <line x1="-12" y1="12" x2="12" y2="12" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="2,2" />

    <!-- Central do-Operator Core -->
    <circle cx="0" cy="0" r="5.5" fill="#fde047" stroke="#ffffff" stroke-width="1" />
    <text x="0" y="2.5" font-family="-apple-system, sans-serif" font-weight="900" font-size="7" fill="#064e3b" text-anchor="middle">do</text>
  </g>
</svg>
