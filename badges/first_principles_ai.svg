<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="392" height="112" rx="16" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="2.5" />
  
  <!-- Glowing Hexagon Emblem -->
  <g transform="translate(55, 60)">
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#1e1b4b" stroke="url(#goldBorder)" stroke-width="2" filter="url(#glow)" />
    <!-- Neural Node Icon -->
    <circle cx="0" cy="0" r="8" fill="#fbbf24" />
    <circle cx="-16" cy="-14" r="4.5" fill="#06b6d4" />
    <circle cx="16" cy="-14" r="4.5" fill="#06b6d4" />
    <circle cx="-16" cy="14" r="4.5" fill="#06b6d4" />
    <circle cx="16" cy="14" r="4.5" fill="#06b6d4" />
    <line x1="-16" y1="-14" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="16" y1="-14" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="-16" y1="14" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="16" y1="14" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <text x="115" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#f8fafc" letter-spacing="1">
    FIRST-PRINCIPLES AI
  </text>
  <text x="115" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#38bdf8" letter-spacing="0.5">
    AUTOGRAD &amp; TENSOR SPECIALIST
  </text>
  <rect x="115" y="78" width="170" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="125" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#fbbf24">
    ★ 100% VECTORIZED NUMPY
  </text>
  <text x="320" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#10b981">
    TIER-1
  </text>
</svg>
