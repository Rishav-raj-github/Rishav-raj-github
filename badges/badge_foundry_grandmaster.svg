<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="foundryBg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="85%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer White Achievement Rim -->
  <circle cx="60" cy="60" r="54" fill="url(#foundryBg)" stroke="#ffffff" stroke-width="4.5" filter="url(#badgeShadow)" />
  
  <!-- Subtle Highlight Gloss -->
  <ellipse cx="60" cy="24" rx="36" ry="14" fill="#ffffff" opacity="0.15" />

  <!-- 3D Neural Anvil & Core Crystal -->
  <g transform="translate(60, 62)">
    <!-- Base Platform -->
    <path d="M -26,14 L 26,14 L 20,24 L -20,24 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="-16" y1="18" x2="16" y2="18" stroke="#38bdf8" stroke-width="1" opacity="0.6" />

    <!-- Anvil Horns -->
    <path d="M -30,6 Q -15,12 0,10 Q 15,12 30,6 L 24,14 L -24,14 Z" fill="#334155" stroke="#64748b" stroke-width="1" />

    <!-- Glowing Crystal Core -->
    <polygon points="0,-26 18,-6 0,14 -18,-6" fill="url(#goldGlow)" stroke="#ffffff" stroke-width="1.5" filter="drop-shadow(0 0 6px #f59e0b)" />
    
    <!-- Orbiting Neural Sparks -->
    <circle cx="-22" cy="-12" r="3" fill="#38bdf8" />
    <circle cx="22" cy="-12" r="3" fill="#38bdf8" />
    <circle cx="0" cy="-32" r="3" fill="#fef08a" />
    
    <line x1="-22" y1="-12" x2="-12" y2="-6" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,1" />
    <line x1="22" y1="-12" x2="12" y2="-6" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,1" />
    <line x1="0" y1="-32" x2="0" y2="-26" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="2,1" />

    <!-- Star Tier Accent -->
    <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,3 -4,5 -3,1 -6,-2 -2,-2" fill="#ffffff" />
  </g>
</svg>
