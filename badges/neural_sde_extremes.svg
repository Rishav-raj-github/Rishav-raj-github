  </text>
  <rect x="115" y="78" width="180" height="20" rx="6" fill="#450a0a" stroke="#881337" stroke-width="1" />
  <text x="125" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#f43f5e">
