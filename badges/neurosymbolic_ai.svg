<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradNeuro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="skyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glowNeuro" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="4" y="4" width="392" height="112" rx="16" fill="url(#bgGradNeuro)" stroke="url(#skyBorder)" stroke-width="2.5" />
  
  <g transform="translate(55, 60)">
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#082f49" stroke="url(#skyBorder)" stroke-width="2" filter="url(#glowNeuro)" />
    <!-- Isometric Tensor Cube Motif -->
    <path d="M 0,-15 L 14,-7 L 14,9 L 0,17 L -14,9 L -14,-7 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="17" x2="0" y2="1" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="1" x2="14" y2="-7" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="1" x2="-14" y2="-7" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <text x="115" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#f8fafc" letter-spacing="1">
    NEUROSYMBOLIC TENSOR AI
  </text>
  <text x="115" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#38bdf8" letter-spacing="0.5">
    T-NORMS • TENSOR-TRAIN • VERIFICATION
  </text>
  <rect x="115" y="78" width="180" height="20" rx="6" fill="#0c4a6e" stroke="#0369a1" stroke-width="1" />
  <text x="125" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#7dd3fc">
    ★ FORMAL SAFETY CERTIFIED
  </text>
  <text x="320" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#38bdf8">
    PRO
  </text>
</svg>
