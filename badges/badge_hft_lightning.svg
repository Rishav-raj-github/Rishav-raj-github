<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="hftBg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#hftBg)" stroke="#ffffff" stroke-width="4.5" filter="url(#badgeShadow)" />
  <ellipse cx="60" cy="24" rx="36" ry="14" fill="#ffffff" opacity="0.25" />

  <!-- Lightning & Speed Rings -->
  <g transform="translate(60, 60)">
    <!-- Speed Shockwaves -->
    <path d="M -26,-15 Q -32,0 -26,15" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 26,-15 Q 32,0 26,15" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- 3D Lightning Bolt -->
    <polygon points="4,-28 -14,2 0,2 -6,28 16,-4 2,-4" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="drop-shadow(0 0 4px #fff)" />
  </g>
</svg>
