<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradCausal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowCausal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="4" y="4" width="392" height="112" rx="16" fill="url(#bgGradCausal)" stroke="url(#emeraldBorder)" stroke-width="2.5" />
  
  <g transform="translate(55, 60)">
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#064e3b" stroke="url(#emeraldBorder)" stroke-width="2" filter="url(#glowCausal)" />
    <!-- DAG Motif -->
    <circle cx="-14" cy="10" r="5" fill="#34d399" />
    <circle cx="0" cy="-15" r="5" fill="#34d399" />
    <circle cx="14" cy="10" r="5" fill="#34d399" />
    <line x1="-12" y1="8" x2="-2" y2="-12" stroke="#6ee7b7" stroke-width="1.8" marker-end="url(#arrow)" />
    <line x1="0" y1="-12" x2="12" y2="8" stroke="#6ee7b7" stroke-width="1.8" />
    <line x1="-10" y1="10" x2="10" y2="10" stroke="#6ee7b7" stroke-width="1.8" stroke-dasharray="2,2" />
  </g>

  <text x="115" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#f8fafc" letter-spacing="1">
    CAUSAL DISCOVERY &amp; SCM
  </text>
  <text x="115" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#6ee7b7" letter-spacing="0.5">
    NOTEARS • DO-CALCULUS • DML
  </text>
  <rect x="115" y="78" width="180" height="20" rx="6" fill="#064e3b" stroke="#047857" stroke-width="1" />
  <text x="125" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#34d399">
    ★ IDENTIFIABILITY CERTIFIED
  </text>
  <text x="320" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#34d399">
    ELITE
  </text>
</svg>
