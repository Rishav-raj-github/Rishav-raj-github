<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="riemBg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#riemBg)" stroke="#ffffff" stroke-width="4.5" filter="url(#badgeShadow)" />
  <ellipse cx="60" cy="24" rx="36" ry="14" fill="#ffffff" opacity="0.2" />

  <!-- Hyperbolic Möbius / Poincaré Manifold -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#f5d0fe" stroke-width="2" />
    
    <!-- Geodesic Arcs -->
    <path d="M -28,0 A 28,28 0 0,0 0,28 A 28,28 0 0,0 28,0 A 28,28 0 0,0 0,-28 A 28,28 0 0,0 -28,0" fill="none" stroke="#e879f9" stroke-width="1.8" />
    <ellipse cx="0" cy="0" rx="28" ry="12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" />
    <ellipse cx="0" cy="0" rx="12" ry="28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" />

    <!-- Center Point Singularity -->
    <circle cx="0" cy="0" r="5" fill="#fef08a" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>
