<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGradRiem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="glowRiem" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="4" y="4" width="392" height="112" rx="16" fill="url(#bgGradRiem)" stroke="url(#purpleBorder)" stroke-width="2.5" />
  
  <g transform="translate(55, 60)">
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#2e1065" stroke="url(#purpleBorder)" stroke-width="2" filter="url(#glowRiem)" />
    <!-- Hyperbolic Poincaré Disc Ring Motif -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="16" ry="7" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#e879f9" />
  </g>

  <text x="115" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#f8fafc" letter-spacing="1">
    RIEMANNIAN &amp; TOPOLOGY
  </text>
  <text x="115" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#c084fc" letter-spacing="0.5">
    POINCARÉ BALL • NEURAL ODE • TDA
  </text>
  <rect x="115" y="78" width="180" height="20" rx="6" fill="#3b0764" stroke="#6b21a8" stroke-width="1" />
  <text x="125" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#e879f9">
    ★ NON-EUCLIDEAN GEOMETRY
  </text>
  <text x="320" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#c084fc">
    EXPERT
  </text>
</svg>
